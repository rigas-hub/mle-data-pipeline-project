services:
  postgres:
    image: postgres:17
    container_name: ny-taxi-db
    environment:
      POSTGRES_DB: ny_taxi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ny_taxi"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./data/db-data:/var/lib/postgresql/data
