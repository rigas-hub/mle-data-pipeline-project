[project]
name = "mle-data-pipeline-project"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "click>=8.5.0",
    "duckdb>=2.0.0",
    "pandas>=3.0.5",
    "prefect>=3.8.6",
    "prefect-sqlalchemy>=0.6.1",
    "polars>=2.0.0",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.17.4",
]

[tool.ty.environment]
root = [".", "solution/src"]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
# Prefect's server still uses FastAPI's removed min_items argument.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2", "fastapi<0.155"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
